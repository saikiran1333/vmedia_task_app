name: vmedia
description: "Vmedia Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  google_fonts: ^6.2.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo/
    - assets/images/banners/
    - assets/images/products/
    - assets/images/categories/
    - assets/images/process/
    - assets/images/icons/
    - assets/images/clients/
    - assets/images/press/
